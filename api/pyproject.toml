[project]
name = "todo-api"
version = "0.1.0"
description = "FastAPI To-Do API with SQLAlchemy and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=api --cov-report=term-missing --cov-report=html"

[tool.ruff]
# Ruff Configuration for To-Do API
# Follows project conventions: PEP 8, snake_case, type hints
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable all rules by default, then selectively disable
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "S101",  # assert used (allowed in tests)
    "S311",  # standard pseudo-random generators (allowed for simplicity)
    "PLR0913", # too many arguments in function definition
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLW2901", # outer scope name shadowing
    "RUF001", # ambiguous unicode character
    "RUF002", # ambiguous unicode character
    "RUF003", # ambiguous unicode character
]

# Type checking imports should be at the top
isort.known-first-party = ["api"]
isort.known-third-party = ["fastapi", "sqlalchemy", "pydantic", "uvicorn", "psycopg2"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PT001", "PT011", "PT012", "PT013"]
"*/conftest.py" = ["F401", "F403", "F405"]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "validator", "root_validator"]
staticmethod-decorators = ["staticmethod", "validator", "root_validator"]

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "single"
indent-style = "space"
line-ending = "lf"
