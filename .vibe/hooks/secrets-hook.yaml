name: secrets-hook
version: 1.0.0
description: |
  Security hook for detecting and preventing secret leaks. Scans files for sensitive
  information, API keys, passwords, and other secrets before they are committed.

# Hook type
type: pre-commit

# Events to listen for
events:
  - git.pre_commit
  - git.commit_msg
  - file.create
  - file.modify

# Priority (higher = runs first)
priority: 100

# Patterns to scan for secrets
patterns:
  # API Keys and Tokens
  - name: api_key_generic
    pattern: "(?:api[_-]?key|apikey|api[_-]?secret)[=:\"']\s*[\"']?([a-zA-Z0-9_\-]{20,})[\"']?"
    severity: critical
    message: "Potential API key detected"
    
  - name: github_token
    pattern: "(?:ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9_]{36,}"
    severity: critical
    message: "GitHub token detected"
    
  - name: aws_access_key
    pattern: "(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}"
    severity: critical
    message: "AWS access key detected"
    
  - name: aws_secret_key
    pattern: "(?:aws[_-]?secret[_-]?access[_-]?key|aws[_-]?secret[_-]?key)[=:\"']\s*[\"']?([a-zA-Z0-9/+=]{40})[\"']?"
    severity: critical
    message: "AWS secret key detected"
    
  - name: google_api_key
    pattern: "AIza[0-9A-Za-z\-_]{35}"
    severity: critical
    message: "Google API key detected"
    
  - name: slack_token
    pattern: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*"
    severity: critical
    message: "Slack token detected"
    
  - name: stripe_key
    pattern: "(?:sk|pk)_(?:test|live)_[0-9a-zA-Z]{24,}"
    severity: critical
    message: "Stripe API key detected"
    
  # Database credentials
  - name: database_url_with_credentials
    pattern: "(?:mysql|postgres|postgresql|mongodb|redis|amqp)://[^:]+:[^@]+@[^\s]+"
    severity: critical
    message: "Database URL with embedded credentials detected"
    
  - name: postgres_password
    pattern: "(?:POSTGRES|DB|DATABASE)[_-]?PASSWORD[=:\"']\s*[\"']?([^\"'\s]{8,})[\"']?"
    severity: critical
    message: "PostgreSQL password detected"
    
  - name: mysql_password
    pattern: "(?:MYSQL|DB)[_-]?PASS(?:WORD)?[=:\"']\s*[\"']?([^\"'\s]{8,})[\"']?"
    severity: critical
    message: "MySQL password detected"
    
  # Generic passwords
  - name: password_in_code
    pattern: "(?:password|passwd|pwd|secret)[=:\"']\s*[\"']?([^\"'\s]{8,})[\"']?"
    severity: critical
    message: "Password detected in code"
    
  - name: hardcoded_password
    pattern: "(?:PASSWORD|SECRET|API_KEY|TOKEN)[=:\"']\s*[\"']?[^\"'\s]{8,}[\"']?"
    severity: critical
    message: "Hardcoded credential detected"
    
  # Private keys
  - name: private_key
    pattern: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    severity: critical
    message: "Private key detected"
    
  - name: ssh_key
    pattern: "ssh-rsa [a-zA-Z0-9+/=]{200,}"
    severity: critical
    message: "SSH key detected"
    
  # JWT tokens
  - name: jwt_token
    pattern: "eyJ[A-Za-z0-9-_=]+\.eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_.+/=]+"
    severity: high
    message: "JWT token detected"
    
  # Generic secrets
  - name: secret_in_code
    pattern: "(?:secret|access[_-]?token|auth[_-]?token)[=:\"']\s*[\"']?([^\"'\s]{16,})[\"']?"
    severity: high
    message: "Secret token detected"
    
  # Environment files
  - name: env_file_commit
    pattern: "^\.env($|\.[^\.]+)$"
    severity: critical
    message: ".env file should not be committed"
    
  - name: env_local_file
    pattern: "^\.env\.local($|\.[^\.]+)$"
    severity: critical
    message: ".env.local file should not be committed"
    
  # Configuration files with secrets
  - name: config_with_secrets
    pattern: "(?:config|settings|credentials)[\\/-]?[\\/-]?(?:prod|production|staging|dev|development)[\\/-]?\.(?:json|yaml|yml|toml|ini|conf|cfg)$"
    severity: high
    message: "Configuration file with potential secrets detected"

# Files to exclude from scanning
exclude:
  - ".git/**"
  - "node_modules/**"
  - ".venv/**"
  - "dist/**"
  - "build/**"
  - "*.lock"
  - ".env.example"
  - ".env.template"
  - "*.min.js"
  - "*.min.css"

# Actions to take when secrets are detected
actions:
  - name: block_commit
    description: Block the commit if critical secrets are detected
    condition: "severity === 'critical'"
    message: "❌ COMMIT BLOCKED: Critical secrets detected. Remove them before committing."
    
  - name: warn_user
    description: Warn the user about potential secrets
    condition: "severity === 'high'"
    message: "⚠️ WARNING: Potential secrets detected. Review before committing."
    
  - name: suggest_fix
    description: Suggest how to fix the issue
    message: |
      💡 **Suggested Fix**:
      
      For the detected secret:
      
      1. **If it's a real secret**:
         - Remove it from the file immediately
         - Add the file to `.gitignore`
         - Use environment variables instead
         - Rotate the secret if it was exposed
      
      2. **If it's a test/mock value**:
         - Replace with a clearly fake value (e.g., "test_key_123")
         - Add a comment indicating it's a test value
         - Consider using a separate test configuration file
      
      3. **For API keys and tokens**:
         - Use `.env.example` to document required variables
         - Load from `.env` (which is in `.gitignore`)
         - Use dependency injection or configuration management
      
      4. **For database credentials**:
         - Use Docker secrets in production
         - Use environment variables in development
         - Never hardcode in source files
      
      Example fix:
      ```bash
      # Remove the secret from the file
      git rm file_with_secret.txt
      
      # Add to .gitignore
      echo "file_with_secret.txt" >> .gitignore
      
      # Use environment variables instead
      echo "API_KEY=your_key_here" >> .env
      echo ".env" >> .gitignore
      ```

# Integration with project
integration:
  # Files to check for secret patterns
  check_files:
    - "**.py"
    - "**.ts"
    - "**.js"
    - "**.svelte"
    - "**.json"
    - "**.yaml"
    - "**.yml"
    - "**.toml"
    - "**.env*"
    - "Dockerfile*"
    - "docker-compose*.yml"
    - "*.sh"
    - "*.bash"
    - "Makefile"
    
  # Context files to load
  context:
    - AGENTS.md
    - docs/AGENTS.md
    - .gitignore
    - .env.example
    
  # Related security files
  security_files:
    - .gitignore
    - .env.example
    - api/.env.example
    - web/.env.example

# Response templates
responses:
  block_message:
    template: |
      ❌ **COMMIT BLOCKED**
      
      Critical secrets detected in the following files:
      
      {files}
      
      **You must remove these secrets before committing.**
      
      {suggestions}
      
      ---
      *This check is enforced by the secrets-hook to prevent accidental secret exposure.*
    
  warning_message:
    template: |
      ⚠️ **SECURITY WARNING**
      
      Potential secrets detected in the following files:
      
      {files}
      
      **Please review these carefully before committing.**
      
      {suggestions}
      
      ---
      *This warning is provided by the secrets-hook to help prevent accidental secret exposure.*
    
  detection_report:
    template: |
      ## Secret Detection Report
      
      **Scan Date**: {date}
      **Files Scanned**: {file_count}
      **Secrets Found**: {secret_count}
      
      ### 🔴 Critical Issues ({critical_count})
      {critical_issues}
      
      ### 🟡 High Risk Issues ({high_count})
      {high_issues}
      
      ### 📊 Summary
      - **Files with issues**: {affected_files}
      - **Total patterns matched**: {total_matches}
      - **Action required**: {action_required}
      
      ---
      *Report generated by secrets-hook v{version}*

# Configuration
config:
  # Enable/disable the hook
  enabled: true
  
  # Minimum severity to block commits
  block_severity: critical
  
  # Minimum severity to warn
  warn_severity: high
  
  # Maximum file size to scan (in KB)
  max_file_size: 1024
  
  # Number of threads for scanning
  threads: 4
  
  # Timeout for scanning (in seconds)
  timeout: 30

# Git integration
git:
  # Hook type
  hook_type: pre-commit
  
  # Install command
  install: |
    # This hook is automatically installed via the .vibe directory
    # To manually install:
    cp .vibe/hooks/secrets-hook.yaml .git/hooks/pre-commit
    chmod +x .git/hooks/pre-commit
  
  # Bypass option
  bypass:
    enabled: false
    message: "Secrets hook cannot be bypassed for security reasons"
