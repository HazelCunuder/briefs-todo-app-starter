name: Test Suite

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install lint dependencies
        run: bun install --frozen-lockfile

      - name: Run markdown lint
        run: bun run lint:md

      - name: Run YAML lint
        run: bun run lint:yaml

      - name: Run all linting
        run: bun run lint

  api-lint:
    name: API Linting
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || uv sync --frozen-lockfile

      - name: Run Ruff linting
        working-directory: api
        run: |
          python -m ruff check . --config=../pyproject.toml 2>/dev/null || echo "Ruff not configured, skipping"

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [lint, api-lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt 2>/dev/null || uv sync --frozen-lockfile

      - name: Run API tests with coverage
        working-directory: api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          pytest tests/ -v --cov=api --cov-report=xml --cov-report=html -x

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-report
          path: api/htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: api/coverage.xml
          fail_ci_if_error: false

  web-lint:
    name: Web Linting
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript type checking
        working-directory: web
        run: npm run check

      - name: Run ESLint
        working-directory: web
        run: |
          npx eslint src/ --ext .ts,.svelte 2>/dev/null || echo "ESLint not configured, skipping"

  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: [lint, web-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run web tests with coverage
        working-directory: web
        run: |
          npm run test:coverage 2>/dev/null || npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: web/test-results/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, api-lint, web-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: api
          file: api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            hazelcunuder/todo-api:${{ github.sha }}
            hazelcunuder/todo-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            hazelcunuder/todo-web:${{ github.sha }}
            hazelcunuder/todo-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [api-test, web-test, docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose up -d --wait
          sleep 10

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: web
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/

      - name: Stop containers
        if: always()
        run: docker compose down -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, api-lint, api-test, web-lint, web-test, docker-build, e2e-test]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate test summary
        run: |
          echo "# Test Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "## Workflow: ${{ github.workflow }}" >> test-summary.md
          echo "## Run ID: ${{ github.run_id }}" >> test-summary.md
          echo "## Commit: ${{ github.sha }}" >> test-summary.md
          echo "" >> test-summary.md
          
          echo "## Job Results" >> test-summary.md
          echo "" >> test-summary.md
          
          for job in lint api-lint api-test web-lint web-test docker-build e2e-test; do
            status="${{ needs.$job.result }}"
            if [ "$status" = "success" ]; then
              emoji="✅"
            elif [ "$status" = "failure" ]; then
              emoji="❌"
            else
              emoji="⚠️"
            fi
            echo "- $emoji **$job**: $status" >> test-summary.md
          done
          
          echo "" >> test-summary.md
          echo "## Artifacts" >> test-summary.md
          echo "- [API Coverage Report](artifacts/api-coverage-report/index.html)" >> test-summary.md
          echo "- [Web Test Results](artifacts/web-test-results/)" >> test-summary.md
          echo "- [Playwright Report](artifacts/playwright-report/index.html)" >> test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })
