name: Build & Verify

on:
  push:
    branches: [main, develop, feature/*]
    tags: [v*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-metadata:
    name: Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          # Extract version from pyproject.toml
          VERSION=$(grep -E "^version\s*=" api/pyproject.toml | sed 's/.*= *"//;s/"//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          # Short SHA
          echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          
          # Timestamp
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          
          # Check if release
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: build-metadata
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,format=short

      - name: Determine build tags
        id: tag
        run: |
          BASE_TAGS="${{ steps.meta.outputs.tags }}"
          # Add dev tag for non-release builds
          if [ "${{ needs.build-metadata.outputs.is_release }}" = "false" ]; then
            BASE_TAGS="$BASE_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:dev-${{ needs.build-metadata.outputs.short_sha }}"
          fi
          echo "image_tag=$BASE_TAGS" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.build-metadata.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-metadata.outputs.version }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max
          platforms: linux/amd64,linux/arm64

  build-web:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    needs: build-metadata
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,format=short

      - name: Determine build tags
        id: tag
        run: |
          BASE_TAGS="${{ steps.meta.outputs.tags }}"
          if [ "${{ needs.build-metadata.outputs.is_release }}" = "false" ]; then
            BASE_TAGS="$BASE_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:dev-${{ needs.build-metadata.outputs.short_sha }}"
          fi
          echo "image_tag=$BASE_TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.build-metadata.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-metadata.outputs.version }}
          cache-from: type=gha,scope=web-${{ github.ref_name }}
          cache-to: type=gha,scope=web-${{ github.ref_name }},mode=max
          platforms: linux/amd64,linux/arm64

  build-compose:
    name: Build Docker Compose Stack
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker Compose
        run: |
          docker compose build --pull --cache-from type=gha,scope=api-${{ github.ref_name }}
          docker compose build --pull --cache-from type=gha,scope=web-${{ github.ref_name }}

      - name: Verify images
        run: |
          docker images | grep ${{ env.IMAGE_NAME }}
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:dev-${{ needs.build-metadata.outputs.short_sha }} 2>/dev/null || true
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:dev-${{ needs.build-metadata.outputs.short_sha }} 2>/dev/null || true

  verify-build:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    needs: [build-api, build-web, build-compose]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify API Dockerfile
        run: |
          # Check Dockerfile exists and is valid
          test -f api/Dockerfile
          # Check multi-stage build
          grep -q "FROM.*as builder" api/Dockerfile && echo "Multi-stage build: YES" || echo "Multi-stage build: NO"
          # Check non-root user
          grep -q "USER.*appuser" api/Dockerfile && echo "Non-root user: YES" || echo "Non-root user: NO"

      - name: Verify Web Dockerfile
        run: |
          test -f web/Dockerfile
          grep -q "FROM.*node" web/Dockerfile && echo "Node base: YES" || echo "Node base: NO"
          grep -q "USER.*node" web/Dockerfile && echo "Non-root user: YES" || echo "Non-root user: NO"

      - name: Verify docker-compose.yml
        run: |
          test -f docker-compose.yml
          grep -q "healthcheck" docker-compose.yml && echo "Health checks: YES" || echo "Health checks: MISSING"
          grep -q "internal:" docker-compose.yml && echo "Internal network: YES" || echo "Internal network: NO"

      - name: Verify build consistency
        run: |
          # Check that both images use consistent tags
          echo "API image: ${{ needs.build-api.outputs.image_tag }}"
          echo "Web image: ${{ needs.build-web.outputs.image_tag }}"

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29
        with:
          image-ref: ${{ fromJSON(needs.build-api.outputs.image_tag)[0] }}
          format: sarif
          output: trivy-results-api.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-api.sarif

      - name: Run Trivy on Web image
        uses: aquasecurity/trivy-action@v0.29
        with:
          image-ref: ${{ fromJSON(needs.build-web.outputs.image_tag)[0] }}
          format: sarif
          output: trivy-results-web.sarif
          severity: CRITICAL,HIGH

      - name: Upload Web scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-web.sarif

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-api, build-web, verify-build, trivy-scan]
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Metadata" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.build-metadata.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: ${{ needs.build-metadata.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: ${{ needs.build-metadata.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ needs.build-metadata.outputs.is_release }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- API Image: ${{ needs.build-api.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web Image: ${{ needs.build-web.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Compose Build: ${{ needs.build-compose.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Verification: ${{ needs.verify-build.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Scan: ${{ needs.trivy-scan.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-api.result }}" = "success" ] && \
             [ "${{ needs.build-web.result }}" = "success" ] && \
             [ "${{ needs.verify-build.result }}" = "success" ]; then
            echo "✅ All builds successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some builds failed" >> $GITHUB_STEP_SUMMARY
          fi
